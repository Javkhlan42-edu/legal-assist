services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-chatbot-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: legal_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d legal_chatbot']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - legal-chatbot-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: legal-chatbot-pgadmin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_DISABLE_POSTFIX: 'True'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    restart: unless-stopped
    networks:
      - legal-chatbot-net

  chroma:
    image: chromadb/chroma:latest
    container_name: legal-chatbot-chroma
    ports:
      - '8000:8000'
    volumes:
      - chromadata:/chroma/chroma
    environment:
      IS_PERSISTENT: 'TRUE'
      ANONYMIZED_TELEMETRY: 'FALSE'
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/8000"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - legal-chatbot-net

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: legal-chatbot-api
    env_file:
      - ../apps/api/.env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: 3001
      API_HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/legal_chatbot
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-pgvector}
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-mn_legal_rag}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3001/health\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - legal-chatbot-net

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: legal-chatbot-worker
    env_file:
      - ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      chroma:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/legal_chatbot
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-pgvector}
      VECTOR_DB_FALLBACK: ${VECTOR_DB_FALLBACK:-false}
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-mn_legal_rag}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-4}
      EMBEDDING_RETRY_BASE_MS: ${EMBEDDING_RETRY_BASE_MS:-1000}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-512}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-64}
      PIPELINE_FAIL_FAST: ${PIPELINE_FAIL_FAST:-false}
      PIPELINE_MAX_ERROR_RATE: ${PIPELINE_MAX_ERROR_RATE:-0.30}
      PIPELINE_MAX_CONSECUTIVE_FAILURES: ${PIPELINE_MAX_CONSECUTIVE_FAILURES:-20}
      PIPELINE_MAX_RETRIES_PER_DOC: ${PIPELINE_MAX_RETRIES_PER_DOC:-3}
      PIPELINE_RETRY_BASE_MS: ${PIPELINE_RETRY_BASE_MS:-750}
      PIPELINE_MIN_HTML_LENGTH: ${PIPELINE_MIN_HTML_LENGTH:-120}
      PIPELINE_MIN_TEXT_LENGTH: ${PIPELINE_MIN_TEXT_LENGTH:-120}
      PIPELINE_DEAD_LETTER_DIR: ${PIPELINE_DEAD_LETTER_DIR:-data/processed/dead-letter}
      CRAWL_DELAY_MS: ${CRAWL_DELAY_MS:-1000}
      CRAWL_MAX_CONCURRENT: ${CRAWL_MAX_CONCURRENT:-1}
      SHUUKH_MAX_DISCOVERY_PAGES: ${SHUUKH_MAX_DISCOVERY_PAGES:-300}
      CRAWL_CACHE_DIR: ${CRAWL_CACHE_DIR:-./data/cache}
      CRAWL_USER_AGENT: ${CRAWL_USER_AGENT:-LegalRAGBot/0.1}
      SHUUKH_COURT_CATEGORIES: ${SHUUKH_COURT_CATEGORIES:-2,1}
      SHUUKH_RECENT_MONTHS: ${SHUUKH_RECENT_MONTHS:-4}
      SHUUKH_BB: ${SHUUKH_BB:-1}
      SHUUKH_TOPIC_KEYWORDS_CIVIL: "${SHUUKH_TOPIC_KEYWORDS_CIVIL:-зам тээвэр,даатгал,осол,гэрээ,зээл,хөдөлмөр,нөхөн төлбөр}"
      SHUUKH_TOPIC_KEYWORDS_CRIMINAL: "${SHUUKH_TOPIC_KEYWORDS_CRIMINAL:-хулгай,залилан,хүчирхийлэл,мансууруулах,осол,авлига}"
    command: ['pnpm', 'exec', 'tsx', 'src/index.ts', 'schedule']
    volumes:
      - workerdata:/app/data
    healthcheck:
      test: ['CMD-SHELL', 'node -e "process.exit(0)"']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - legal-chatbot-net

networks:
  legal-chatbot-net:
    driver: bridge

volumes:
  pgdata:
  pgadmin-data:
  chromadata:
  workerdata:
