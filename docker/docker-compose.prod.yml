# docker/docker-compose.prod.yml — Production overrides
version: '3.8'

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/legal_chatbot
      VECTOR_DB_PROVIDER: pgvector
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: mn_legal_rag
    restart: always

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
    restart: always

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/legal_chatbot
      VECTOR_DB_PROVIDER: pgvector
      VECTOR_DB_FALLBACK: 'false'
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: mn_legal_rag
    command: ['node', 'dist/index.js', 'schedule']
    restart: always
