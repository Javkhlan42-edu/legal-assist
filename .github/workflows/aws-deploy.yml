name: AWS Deploy

on:
  push:
    branches:
      - main
      - deploy/aws-ec2-ecr-https
  workflow_dispatch:
    inputs:
      domain_name:
        description: Domain name to connect through Route53/ACM
        required: false
        default: hop-on.dev
      instance_type:
        description: EC2 instance type
        required: false
        default: t3.micro

permissions:
  contents: read

env:
  APP_NAME: legal-assist
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  DOMAIN_NAME: ${{ github.event.inputs.domain_name || 'hop-on.dev' }}
  INSTANCE_TYPE: ${{ github.event.inputs.instance_type || 't3.micro' }}
  GIT_REF: ${{ github.ref_name }}

jobs:
  deploy:
    name: Build, Push, Provision, Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS account
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ -n "${AWS_ACCOUNT_ID}" ] && [ "$ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "Expected AWS account $AWS_ACCOUNT_ID, got $ACCOUNT" >&2
            exit 1
          fi
          echo "AWS account: $ACCOUNT"

      - name: Create ECR repositories
        run: |
          set -euo pipefail
          for repo in legal-assist-api legal-assist-web legal-assist-worker; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 ||
              aws ecr create-repository \
                --repository-name "$repo" \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256 >/dev/null
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA::12}"
          API_IMAGE="$REGISTRY/legal-assist-api:$IMAGE_TAG"
          WEB_IMAGE="$REGISTRY/legal-assist-web:$IMAGE_TAG"
          WORKER_IMAGE="$REGISTRY/legal-assist-worker:$IMAGE_TAG"

          docker buildx create --use --name legal-assist-builder || docker buildx use legal-assist-builder
          docker buildx build --push -f docker/api.Dockerfile -t "$API_IMAGE" .
          docker buildx build --push -f docker/worker.Dockerfile -t "$WORKER_IMAGE" .
          docker buildx build --push -f docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_URL= -t "$WEB_IMAGE" .

          {
            echo "API_IMAGE=$API_IMAGE"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "WORKER_IMAGE=$WORKER_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Store production env in SSM SecureString
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCTION_ENV" ]; then
            echo "PRODUCTION_ENV GitHub secret is required." >&2
            exit 1
          fi
          aws ssm put-parameter \
            --name "/${APP_NAME}/prod/env" \
            --type SecureString \
            --value "$PRODUCTION_ENV" \
            --overwrite >/dev/null

      - name: Provision EC2, ALB, ACM, Route53
        id: provision
        run: bash scripts/aws/provision-ec2-alb.sh

      - name: Deploy images to EC2 with SSM
        run: bash scripts/aws/deploy-ec2-ecr.sh

      - name: Public health check
        run: |
          set -euo pipefail
          ALB_DNS="${{ steps.provision.outputs.alb_dns }}"
          CERT_STATUS="${{ steps.provision.outputs.cert_status }}"
          if [ "$CERT_STATUS" = "ISSUED" ]; then
            URL="https://${DOMAIN_NAME}/health"
          else
            URL="http://${ALB_DNS}/health"
          fi
          echo "Checking $URL"
          curl --fail --retry 20 --retry-delay 10 "$URL"
